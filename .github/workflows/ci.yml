name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.10
      - run: ruff check Copy_of_fcc_MAGIC_example.ipynb

  notebook-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt nbconvert ipykernel
      - name: Execute notebook with a one-config neural-network grid
        env:
          QUICK_RUN: "1"
          MPLBACKEND: Agg
        run: >
          jupyter nbconvert --to notebook --execute
          --ExecutePreprocessor.timeout=1200
          --output /tmp/executed.ipynb
          Copy_of_fcc_MAGIC_example.ipynb
